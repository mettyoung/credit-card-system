plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.4.0'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id "org.jetbrains.kotlin.plugin.lombok" version '2.4.0'
    id "org.jetbrains.kotlin.plugin.spring" version '2.4.0'
}

group = 'com.mettyoung'
version = '0.0.1-SNAPSHOT'
description = 'CreditCardApplication'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // Spring Modulith: module boundaries the build enforces. Added before there is a second module, so the
    // first one that needs a boundary is born with it rather than acquiring one after the fact.
    // 2.x is the Boot 4 line.
    implementation platform('org.springframework.modulith:spring-modulith-bom:2.1.1')
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // S3 API for the object store: pre-signed PUTs and the server-side HEAD that verifies the object.
    // Spring Boot has no S3 starter, so the BOM is explicit and the client is a @Bean.
    implementation platform('software.amazon.awssdk:bom:2.34.0')
    implementation 'software.amazon.awssdk:s3'
    // Querydsl for reads whose shape is a projection, not an aggregate: one query with a conditional
    // predicate instead of a derived method per combination. The metamodel is generated from the entities,
    // so columns are never named as strings, and it runs on the same EntityManager as everything else.
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    runtimeOnly 'org.postgresql:postgresql'
    // Order matters: Lombok must run before MapStruct, and the binding makes MapStruct
    // re-read the Lombok-generated getters instead of only the declared fields.
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    // Generates a Q-class per @Entity. Ordered after Lombok, like MapStruct, so the accessors exist first.
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    // Tests are Kotlin + Kotest; main sources stay Java, so the Kotlin plugin only compiles src/test/kotlin.
    testImplementation 'io.kotest:kotest-runner-junit5:6.2.5'
    testImplementation 'io.kotest:kotest-assertions-core:6.2.5'
    testImplementation 'io.kotest:kotest-extensions-spring:6.2.5'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    // Used directly by the architecture specs, not only through Modulith's own verification.
    testImplementation 'com.tngtech.archunit:archunit:1.4.2'
    // Renders the module canvas and per-module diagrams from the verified structure.
    testImplementation 'org.springframework.modulith:spring-modulith-docs'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    // MinIO and the Onfido mock run as plain GenericContainers: Testcontainers 2.x has no
    // module for either, and neither needs more than an image, a port and a wait strategy.
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
}

tasks.named('compileJava') {
    // A new response field with no source fails the build, the same way a new sealed
    // error variant fails the exhaustive switch in ProblemMapper. Main sources only:
    // the test compile has no MapStruct processor and would warn the option is unused.
    options.compilerArgs += ['-Amapstruct.unmappedTargetPolicy=ERROR']
}

kotlin {
    jvmToolchain(21)
}

// The architecture pages live in docs/, where they are maintained beside the specs, and are served by the app under
// /architecture/ so the deployed site can show them. Copied at build time rather than duplicated into static/, so
// there is one source and it cannot drift. Each copy gets a bar linking back to the app and to its sibling page; the
// files in docs/ stay standalone, since a link to the app means nothing when they are opened from the repository.
def architecturePages = [
        'decision-loop.html': 'Decision loop',
        'c4-model.html'     : 'C4 model',
]

def architectureBar = { String current ->
    def links = architecturePages.collect { file, label ->
        file == current ? "<a href=\"${file}\" aria-current=\"page\">${label}</a>" : "<a href=\"${file}\">${label}</a>"
    }.join('')
    """<style>
.cca-bar{--cca-bg:#ffffff;--cca-ink:#12201f;--cca-ink-2:#4a5c5b;--cca-rule:#d6e0df;--cca-accent:#0b6e74;
  display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:10px 16px;background:var(--cca-bg);
  border-bottom:1px solid var(--cca-rule);font:500 14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){.cca-bar{--cca-bg:#152120;--cca-ink:#e6efee;--cca-ink-2:#9fb3b1;--cca-rule:#26393a;--cca-accent:#4fb8be}}
.cca-bar a{color:var(--cca-ink-2);text-decoration:none}
.cca-bar a:hover,.cca-bar a:focus-visible{color:var(--cca-ink);text-decoration:underline}
.cca-bar .cca-home{color:var(--cca-ink);font-weight:700;margin-right:auto}
.cca-bar nav{display:flex;flex-wrap:wrap;gap:4px 16px}
.cca-bar a[aria-current="page"]{color:var(--cca-accent);font-weight:700}
</style>
<header class="cca-bar"><a class="cca-home" href="../">← Credit Card Application</a><nav aria-label="Architecture">${links}<a href="https://github.com/mettyoung/credit-card-system" target="_blank" rel="noopener">Source</a></nav></header>"""
}

tasks.named('processResources') {
    architecturePages.keySet().each { page ->
        from(layout.projectDirectory.file("docs/${page}")) {
            into 'static/architecture'
            filter { String line -> line == '<body>' ? '<body>\n' + architectureBar(page) : line }
        }
    }
}

tasks.named('test') {
    // Kotest runs on the JUnit platform, so the runner is unchanged.
    useJUnitPlatform()
}
