services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432'

  # FR3: uploaded ID and payslip objects. The applicant PUTs bytes straight here through a
  # pre-signed URL; the API only issues the URL and then HEADs the object to verify it.
  #
  # LocalStack's S3, not MinIO. The design names MinIO and the application cannot tell the difference - the
  # ObjectStore port is the whole point - but MinIO's community image is no longer pullable here. Swapping
  # back is this block plus app.storage.endpoint, and no code.
  objectstore:
    image: 'localstack/localstack:3'
    environment:
      - 'SERVICES=s3'
    ports:
      - '4566:4566'

  # FR5: Onfido, mocked. WireMock speaks Onfido's real API, so the adapter makes real HTTP calls
  # over a real socket and the webhook arrives the same way it would in production.
  # Stubs live in mock/onfido and are mounted by both this file and the integration tests.
  #
  # Published on 8081: 8080 is the application's own port, and spring-boot-docker-compose would otherwise
  # hand the adapter a URL that points back at the app.
  onfido-mock:
    image: 'wiremock/wiremock:3.13.2-alpine'
    command: [ '--verbose', '--global-response-templating' ]
    volumes:
      - './mock/onfido:/home/wiremock'
    ports:
      - '8081:8080'
