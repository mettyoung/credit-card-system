; Process tree for the single Cloudflare container. Start order:
;   postgres + minio + onfido-mock (autostart) -> bootstrap (db role, bucket, flyway migrate, once) -> app
; The app has autostart=false; bootstrap starts it only after migrations succeed.

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:postgres]
priority=10
user=postgres
command=/usr/local/pgbin/postgres -D /data/postgres -c listen_addresses=127.0.0.1 -c unix_socket_directories=/var/run/postgresql -c shared_buffers=128MB -c max_connections=40
autorestart=true
stopsignal=INT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; MinIO API must listen on 0.0.0.0: the Worker reaches container ports via the container's network interface
; (10.0.0.1), not loopback. The port is only reachable through the Worker, never directly from the internet.
[program:minio]
priority=10
command=/usr/local/bin/minio server /data/minio --address 0.0.0.0:9000 --console-address 127.0.0.1:9001 --quiet
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Onfido, mocked: the same WireMock stubs as compose.yaml. Loopback only.
[program:onfido-mock]
priority=10
command=java -Xmx160m -XX:+UseSerialGC -jar /opt/wiremock/wiremock-standalone.jar --port 8081 --bind-address 127.0.0.1 --root-dir /opt/onfido-mock --global-response-templating --disable-banner
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; One-shot. Exits 0 after starting the app; a non-zero exit is logged and the app never starts.
[program:bootstrap]
priority=20
command=/usr/local/bin/bootstrap.sh
autorestart=false
startsecs=0
startretries=0
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:app]
priority=30
command=java -jar /app/app.jar
environment=JAVA_TOOL_OPTIONS="%(ENV_APP_JAVA_OPTS)s"
autostart=false
autorestart=true
startsecs=20
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
