spring.application.name=CreditCardApplication

# Schema is owned by Flyway migrations; Hibernate only validates the mapping against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Reject unknown JSON fields so a typo can't be silently ignored.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Framework-generated errors (405, 415, ...) also use RFC 9457 problem JSON.
spring.mvc.problemdetails.enabled=true

# Scheduled workers. Deliberately short in development so the async flow is observable by hand.
# The API specs set app.workers.enabled=false and drive each worker explicitly, so their assertions are
# about behaviour rather than about timing.
app.workers.enabled=true
app.workers.upload-cleanup-interval=15m

# S3-compatible object store. Path-style access is required: virtual-host style would resolve
# bucket.localhost, which does not exist.
app.storage.endpoint=http://localhost:4566
app.storage.region=us-east-1
app.storage.bucket=credit-card-documents
app.storage.access-key=test
app.storage.secret-key=test
# Short: a pre-signed URL is a bearer token for a write into our bucket.
app.storage.upload-url-valid-for=15m
