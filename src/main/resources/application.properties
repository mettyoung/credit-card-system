spring.application.name=CreditCardApplication

# Schema is owned by Flyway migrations; Hibernate only validates the mapping against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Reject unknown JSON fields so a typo can't be silently ignored.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Framework-generated errors (405, 415, ...) also use RFC 9457 problem JSON.
spring.mvc.problemdetails.enabled=true

# Scheduled workers. Deliberately short in development so the async flow is observable by hand.
# The API specs set app.workers.enabled=false and drive each worker explicitly, so their assertions are
# about behaviour rather than about timing.
app.workers.enabled=true
# Spring Modulith's Moments arrives with spring-modulith-starter-core and carries an unconditional
# @EnableScheduling. Nothing here uses its time events, and leaving it in turns the scheduler on even with
# app.workers.enabled=false - so every API spec's workers would race the test that drives them by hand.
spring.autoconfigure.exclude=org.springframework.modulith.moments.autoconfigure.MomentsAutoConfiguration
app.workers.outbox-relay-interval=1s
app.workers.upload-cleanup-interval=15m
app.workers.deadline-interval=15m

# FR9. Placeholders: NEEDS_INFO is a product decision, REFERRED an operations target.
app.deadlines.needs-info=30d
app.deadlines.referred=48h

# FR11: the live timeline streams vendor outcomes and referral reasons, which the applicant must never see.
# Development only; off unless set, and production does not set it.
app.ui.timeline.enabled=true

# S3-compatible object store. Path-style access is required: virtual-host style would resolve
# bucket.localhost, which does not exist.
app.storage.endpoint=http://localhost:4566
app.storage.region=us-east-1
app.storage.bucket=credit-card-documents
app.storage.access-key=test
app.storage.secret-key=test
# Short: a pre-signed URL is a bearer token for a write into our bucket.
app.storage.upload-url-valid-for=15m
# FR10: the web UI uploads straight to the store, cross-origin. Production provisions this rule with the bucket.
app.storage.cors-allowed-origins=http://localhost:8080

app.workers.vendor-interval=1s
app.workers.inbox-interval=1s
app.workers.reconciler-interval=30s

# Onfido. In production this is https://api.eu.onfido.com and a real token; the mock speaks the same API,
# so nothing else changes. Port 8081, because 8080 is the application's own.
app.onfido.base-url=http://localhost:8081
app.onfido.api-version=v3.6
app.onfido.api-token=${ONFIDO_API_TOKEN:test-api-token}
app.onfido.webhook-token=${ONFIDO_WEBHOOK_TOKEN:test-webhook-token}
app.onfido.submit-timeout=10s
app.onfido.result-deadline=30m
# 10 s, not a minute: the mock never calls back, so in development the reconciler is what brings the result to a
# person walking through the web UI (FR10). The API specs set it to 0s.
app.onfido.poll-after=10s
app.onfido.max-attempts=5
