name: deploy-cloudflare

# Continuous deployment of cf-container/ (Worker + Container) to Cloudflare.
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   - API token, see cf-container/README.md "Continuous deployment"
#   CLOUDFLARE_ACCOUNT_ID  - Cloudflare account ID
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push supersedes a queued one.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest   # has Docker, which wrangler needs to build + push the container image
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cf-container
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cf-container/package-lock.json

      - name: Check secrets are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || { echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not set"; missing=1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Repository secret CLOUDFLARE_ACCOUNT_ID is not set"; missing=1; }
          exit $missing

      - run: npm ci

      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
